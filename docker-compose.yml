
name: sonara

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sonara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonara_password}
      POSTGRES_DB: ${POSTGRES_DB:-sonara_db}
    ports:
      - "${HOST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-sonara_user} -d ${POSTGRES_DB:-sonara_db}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: sonara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: rustfs/rustfs:latest
    container_name: sonara-minio
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in the root .env file}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in the root .env file}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonara-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      ENVIRONMENT: development
      DEBUG: "true"

      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-sonara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonara_password}
      POSTGRES_DB: ${POSTGRES_DB:-sonara_db}

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sonara_user}:${POSTGRES_PASSWORD:-sonara_password}@postgres:5432/${POSTGRES_DB:-sonara_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sonara_user}:${POSTGRES_PASSWORD:-sonara_password}@postgres:5432/${POSTGRES_DB:-sonara_db}

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in the root .env file}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in the root .env file}
      S3_BUCKET_NAME: sonara-recordings
      S3_REGION: us-east-1
      S3_USE_SSL: "false"

      EMBEDDING_DIMENSION: "384"
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5

      MAX_AUDIO_UPLOAD_SIZE_MB: "250"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/api/v1/health/live
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonara-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - -Q
      - ingest,asr,index,delete,maintenance,eval

    env_file:
      - ./backend/.env.example

    environment:
      ENVIRONMENT: development
      DEBUG: "true"

      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-sonara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonara_password}
      POSTGRES_DB: ${POSTGRES_DB:-sonara_db}

      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sonara_user}:${POSTGRES_PASSWORD:-sonara_password}@postgres:5432/${POSTGRES_DB:-sonara_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sonara_user}:${POSTGRES_PASSWORD:-sonara_password}@postgres:5432/${POSTGRES_DB:-sonara_db}

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in the root .env file}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in the root .env file}
      S3_BUCKET_NAME: sonara-recordings
      S3_REGION: us-east-1
      S3_USE_SSL: "false"

      EMBEDDING_DIMENSION: "384"
      EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5

      MAX_AUDIO_UPLOAD_SIZE_MB: "250"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
