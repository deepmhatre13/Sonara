[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonara-backend"
version = "0.1.0"
description = "Sonara — Audio Intelligence & Knowledge Retrieval Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API and configuration
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",

    # Authentication and security
    "python-jose[cryptography]>=3.3.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",

    # Database and migrations
    "SQLAlchemy[asyncio]>=2.0.35,<3.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",

    # Background processing and cache
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Object storage
    "boto3>=1.35.0",

    # Audio processing
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "numpy>=1.26.4",
    "av>=12.0.0,<14.0.0",

    # Speech recognition
    "faster-whisper>=1.1.0",

    # Transformer-based speech recognition fallback
    "transformers>=4.45.0",
    "torch>=2.4.0",

    # Semantic embeddings and retrieval
    "sentence-transformers>=3.3.0",

    # LLM providers
    "google-genai>=1.0.0",
    "groq>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["B008", "E501", "UP042"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"